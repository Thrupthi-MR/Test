name: List Pull Requests

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  list-prs:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install requests
